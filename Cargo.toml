[workspace]
resolver = "3"
members = [
    "crates/z-shell-protocol",
    "crates/z-shell-config",
    "crates/z-shell-bus",
    "crates/z-shell-plugins",
    "crates/z-shell-wayland",
    "crates/z-shell-theme",
    "crates/z-shell-system",
    "crates/z-shell-clipboard",
    "crates/z-shell-desktop",
    "crates/z-shell-session",
    "crates/z-shelld",
    "crates/z-shell-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
z-shell-protocol = { path = "crates/z-shell-protocol" }
z-shell-config = { path = "crates/z-shell-config" }
z-shell-plugins = { path = "crates/z-shell-plugins" }
z-shell-bus = { path = "crates/z-shell-bus" }
z-shell-wayland = { path = "crates/z-shell-wayland" }
z-shell-theme = { path = "crates/z-shell-theme" }
z-shell-system = { path = "crates/z-shell-system" }
z-shell-clipboard = { path = "crates/z-shell-clipboard" }
z-shell-desktop = { path = "crates/z-shell-desktop" }
z-shell-session = { path = "crates/z-shell-session" }
anyhow = "1"
chacha20poly1305 = "0.10"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libloading = "0.8"
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-server = "0.31"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
