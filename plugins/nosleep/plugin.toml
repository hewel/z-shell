id = "z-shell/nosleep"
name = "NoSleep"
version = "0.1.0"
plugin_api = 1
author = "z-shell"
license = "MIT"
description = "Manual sleep inhibition and Herdr agent-working detection backed by z-shelld bus inhibitors"

[host_capabilities]
control_channel = true

[bus_permissions]
topics_read = []
topics_publish = ["plugin.z-shell.nosleep.state"]
commands_register = ["plugin.z-shell.nosleep.toggle", "plugin.z-shell.nosleep.status"]
inhibitors = true

[[setting]]
key = "poll_interval_ms"
type = "integer"
default = 2000
min = 500
max = 60000

[[setting]]
key = "agent_working_dir"
type = "string"
default = ""

[[setting]]
key = "inhibit_scope"
type = "string"
default = "sleep"

[[service]]
id = "service"
entry = "src/zgui-adapter.ts"
title = "NoSleep Inhibitor Service"
description = "Reconciles manual toggles and active agent markers into one z-shelld bus inhibitor lease"

[[widget]]
id = "bar-indicator"
entry = "src/widget.tsx"
title = "NoSleep Bar Indicator"

[[panel]]
id = "panel"
entry = "src/panel.tsx"
title = "NoSleep Panel"
