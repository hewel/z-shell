id = "z-shell/niri-overview"
name = "Niri Overview"
version = "0.1.0"
plugin_api = 1
author = "z-shell"
license = "MIT"
description = "Publishes an output-local workspace and window overview for Niri."

[host_capabilities]
shell_surfaces = true
control_channel = true
# Bind niri to the compositor's NIRI_SOCKET path at host launch.
named_sockets = ["niri"]

[bus_permissions]
topics_read = []
topics_publish = ["plugin.z-shell.niri-overview.state"]
commands_register = ["plugin.z-shell.niri-overview.toggle", "plugin.z-shell.niri-overview.refresh"]
inhibitors = false

[[setting]]
key = "zoom_scale"
type = "number"
default = 0.5
min = 0.25
max = 1.0

[[setting]]
key = "max_queue_depth"
type = "integer"
default = 64
min = 8
max = 256

[[service]]
id = "service"
entry = "src/zgui-adapter.ts"
title = "Niri Overview Coordinator"

[[layer]]
id = "overview"
entry = "src/layer.tsx"
title = "Niri Workspace Overview"
